<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Personaje</title>
    <style>
        /* ESTILOS (CSS): Aquí hacemos que se vea bonito y divertido */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .tarjeta-juego {
            background-color: #ffffff;
            color: #333;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 400px;
            max-width: 100%;
            animation: aparecer 0.5s ease-out;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            margin-top: 0;
            font-size: 2em;
        }

        .info-juego {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #666;
        }

        .contenedor-imagen {
            position: relative;
            width: 100%;
            height: 280px;
            margin-bottom: 20px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid #667eea;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.05);
        }

        .pista {
            background-color: #f8f9fa;
            color: #555;
            padding: 15px;
            border-radius: 10px;
            font-style: italic;
            font-size: 1em;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #ddd;
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input.error {
            border-color: #e74c3c;
            animation: sacudir 0.5s;
        }

        @keyframes sacudir {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        input.correcto {
            border-color: #27ae60;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            min-height: 30px;
            font-size: 1.1em;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .mensaje-exito {
            background-color: #d4edda;
            color: #155724;
        }

        .mensaje-error {
            background-color: #f8d7da;
            color: #721c24;
        }

        .pantalla-final {
            text-align: center;
        }

        .pantalla-final h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .pantalla-final .emoji {
            font-size: 5em;
            animation: girar 2s ease-in-out infinite;
        }

        @keyframes girar {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(360deg); }
        }

        .estadisticas {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .estadisticas p {
            margin: 10px 0;
            font-size: 1.2em;
            color: #333;
        }

        .btn-secundario {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 10px;
        }

        .progreso-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progreso-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="tarjeta-juego" id="contenedor-principal">
        <h1>🎭 ¿Quién soy?</h1>
        
        <div class="info-juego">
            <span>Nivel: <strong><span id="nivel-actual">1</span>/<span id="nivel-total">0</span></strong></span>
            <span>Intentos: <strong id="intentos">0</strong></span>
        </div>

        <div class="progreso-bar">
            <div class="progreso-fill" id="progreso"></div>
        </div>
        
        <div class="contenedor-imagen">
            <img id="img-personaje" src="" alt="Personaje">
        </div>
        
        <div class="pista" id="texto-pista">Cargando...</div>
        
        <div class="input-group">
            <input type="text" id="input-respuesta" placeholder="Escribe el nombre..." autocomplete="off">
        </div>
        
        <button id="btn-adivinar" onclick="verificarRespuesta()">🎯 ¡Adivinar!</button>
        
        <div id="mensaje"></div>
    </div>

    <script>
        /* LÓGICA (JS): Aquí está el cerebro del juego */
        
        // 1. LISTA DE PERSONAJES (¡Edita esto con tus propios personajes!)
        const personajes = [
            {
                nombre: "pikachu",
                pista: "Ratón eléctrico amarillo, mascota de Pokémon.",
                imagen: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/25.png"
            },
            {
                nombre: "mario",
                pista: "Fontanero italiano con bigote y gorra roja.",
                imagen: "https://i.imgur.com/lNGkzQF.png"
            },
            {
                nombre: "sonic",
                pista: "Erizo azul súper rápido que colecciona anillos.",
                imagen: "https://i.imgur.com/8kXKWQu.png"
            },
            {
                nombre: "mickey mouse",
                pista: "Ratón con orejas grandes, símbolo de Disney.",
                imagen: "https://i.imgur.com/Pz9PQSB.png"
            },
            {
                nombre: "bob esponja",
                pista: "Esponja amarilla que vive en una piña bajo el mar.",
                imagen: "https://i.imgur.com/6W4z5Qy.png"
            }
        ];

        let nivelActual = 0;
        let intentosTotales = 0;
        let intentosNivel = 0;

        // Inicializar el juego
        function inicializarJuego() {
            document.getElementById("nivel-total").textContent = personajes.length;
            cargarNivel();
            
            // Permitir presionar Enter para enviar
            document.getElementById("input-respuesta").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    verificarRespuesta();
                }
            });
        }

        // Función para cargar el personaje en pantalla
        function cargarNivel() {
            if (nivelActual < personajes.length) {
                const p = personajes[nivelActual];
                
                document.getElementById("img-personaje").src = p.imagen;
                document.getElementById("texto-pista").textContent = "💡 " + p.pista;
                document.getElementById("input-respuesta").value = "";
                document.getElementById("mensaje").textContent = "";
                document.getElementById("mensaje").className = "";
                document.getElementById("input-respuesta").className = "";
                document.getElementById("nivel-actual").textContent = nivelActual + 1;
                document.getElementById("btn-adivinar").disabled = false;
                
                // Actualizar barra de progreso
                const progreso = ((nivelActual) / personajes.length) * 100;
                document.getElementById("progreso").style.width = progreso + "%";
                
                intentosNivel = 0;
                document.getElementById("input-respuesta").focus();
            } else {
                mostrarPantallaFinal();
            }
        }

        // Función que revisa si escribiste bien
        function verificarRespuesta() {
            let respuestaUsuario = document.getElementById("input-respuesta").value.toLowerCase().trim();
            let respuestaCorrecta = personajes[nivelActual].nombre.toLowerCase();
            let inputElement = document.getElementById("input-respuesta");
            let mensajeDiv = document.getElementById("mensaje");
            let boton = document.getElementById("btn-adivinar");

            if (respuestaUsuario === "") {
                mensajeDiv.className = "mensaje-error";
                mensajeDiv.textContent = "⚠️ Escribe algo primero";
                return;
            }

            intentosTotales++;
            intentosNivel++;
            document.getElementById("intentos").textContent = intentosTotales;

            if (respuestaUsuario === respuestaCorrecta) {
                // CORRECTO
                mensajeDiv.className = "mensaje-exito";
                mensajeDiv.textContent = "✅ ¡Correcto! " + (intentosNivel === 1 ? "¡Perfecto en el primer intento!" : "");
                inputElement.className = "correcto";
                boton.disabled = true;
                
                // Esperar 2 segundos antes de cambiar
                setTimeout(() => {
                    nivelActual++;
                    cargarNivel();
                }, 2000);
            } else {
                // INCORRECTO
                mensajeDiv.className = "mensaje-error";
                mensajeDiv.textContent = "❌ ¡Ups! Intenta de nuevo.";
                inputElement.className = "error";
                
                // Quitar clase error después de la animación
                setTimeout(() => {
                    inputElement.className = "";
                }, 500);
            }
        }

        // Pantalla final cuando completas el juego
        function mostrarPantallaFinal() {
            const promedio = (intentosTotales / personajes.length).toFixed(1);
            let mensaje = "";
            
            if (promedio <= 1.5) {
                mensaje = "¡ERES UN GENIO! 🧠✨";
            } else if (promedio <= 3) {
                mensaje = "¡MUY BIEN! 🌟";
            } else {
                mensaje = "¡COMPLETADO! 🎉";
            }

            document.getElementById("contenedor-principal").innerHTML = `
                <div class="pantalla-final">
                    <div class="emoji">🏆</div>
                    <h1>${mensaje}</h1>
                    
                    <div class="estadisticas">
                        <p><strong>Personajes adivinados:</strong> ${personajes.length}</p>
                        <p><strong>Intentos totales:</strong> ${intentosTotales}</p>
                        <p><strong>Promedio:</strong> ${promedio} intentos por personaje</p>
                    </div>
                    
                    <button onclick="location.reload()">🔄 Jugar de Nuevo</button>
                </div>
            `;
            
            // Actualizar progreso al 100%
            document.getElementById("progreso").style.width = "100%";
        }

        // Iniciar el juego cuando cargue la página
        inicializarJuego();
    </script>
</body>
</html>
