<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Adivina el Personaje</title>
    <style>
        /* AQUÍ VA EL DISEÑO (CSS) */
        body {
            font-family: 'Comic Sans MS', sans-serif; /* Fuente divertida */
            background-color: #2c3e50;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background-color: #ecf0f1;
            color: #333;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 300px;
        }
        img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            border: 5px solid #e67e22;
        }
        input {
            padding: 10px;
            margin-top: 15px;
            width: 80%;
            border-radius: 5px;
            border: 2px solid #bdc3c7;
            font-size: 16px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05); /* Efecto visual al pasar el mouse */
        }
        #mensaje {
            margin-top: 15px;
            font-weight: bold;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>¿Quién soy?</h1>
        <img id="personaje-img" src="" alt="Personaje Oculto">
        
        <p id="pista">Pista: Cargando...</p>
        
        <input type="text" id="respuesta" placeholder="Escribe el nombre aquí...">
        <br>
        <button onclick="verificarRespuesta()">¡Adivinar!</button>
        
        <p id="mensaje"></p>
    </div>

    <script>
        /* AQUÍ VA LA LÓGICA (JAVASCRIPT) */
        
        // 1. CONFIGURACIÓN: CAMBIA ESTO PARA TUS PROPIOS PERSONAJES
        const niveles = [
            {
                nombre: "mario",
                pista: "Soy fontanero y tengo bigote.",
                imagen: "https://upload.wikimedia.org/wikipedia/en/a/a9/MarioNSMBUDeluxe.png"
            },
            {
                nombre: "batman",
                pista: "Soy millonario y me visto de murciélago.",
                imagen: "https://upload.wikimedia.org/wikipedia/en/c/c7/Batman_Infobox.jpg"
            },
            {
                nombre: "messi",
                pista: "Campeón del mundo con Argentina.",
                imagen: "https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg"
            }
        ];

        let nivelActual = 0;

        // Función para cargar el nivel
        function cargarNivel() {
            if (nivelActual < niveles.length) {
                document.getElementById("personaje-img").src = niveles[nivelActual].imagen;
                document.getElementById("pista").textContent = "Pista: " + niveles[nivelActual].pista;
                document.getElementById("respuesta").value = "";
                document.getElementById("mensaje").textContent = "";
            } else {
                // Fin del juego
                document.querySelector(".game-card").innerHTML = "<h1>¡Ganaste! 🎉</h1><p>Has adivinado a todos.</p>";
            }
        }

        // Función para verificar si acertó
        function verificarRespuesta() {
            let respuestaUsuario = document.getElementById("respuesta").value.toLowerCase().trim(); // Convertir a minúsculas
            let respuestaCorrecta = niveles[nivelActual].nombre.toLowerCase();

            if (respuestaUsuario === respuestaCorrecta) {
                document.getElementById("mensaje").style.color = "green";
                document.getElementById("mensaje").textContent = "¡Correcto! Siguiente...";
                
                // Esperar 1 segundo y pasar al siguiente
                setTimeout(() => {
                    nivelActual++;
                    cargarNivel();
                }, 1500);
            } else {
                document.getElementById("mensaje").style.color = "red";
                document.getElementById("mensaje").textContent = "¡Ups! Intenta de nuevo.";
            }
        }

        // Iniciar el juego al cargar
        cargarNivel();

    </script>
</body>
</html>
